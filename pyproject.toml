[project]
name = "ai-core"
version = "0.1.0"
description = "Small reusable AI runtime primitives."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.99,<4",
    "pydantic>=2.8",
]

[project.optional-dependencies]
observe = [
    "langfuse>=3,<4",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_core = ["py.typed"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["ai_core", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not integration'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: optional live OpenAI call; not run in CI",
]
